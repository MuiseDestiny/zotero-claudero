<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
  <html:link rel="localization" href="__addonRef__-addon.ftl" />
  <html:link
    rel="stylesheet"
    href="chrome://__addonRef__/content/zoteroPane.css"
  />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <vbox class="claudero-pref-stack">
    <html:div class="claudero-pref-heading">
      <html:h2>Claudero</html:h2>
      <html:p data-l10n-id="pref-heading-description"></html:p>
    </html:div>
    <html:div class="claudero-pref-card">
      <html:div class="claudero-pref-tabs-wrapper">
        <html:button
          type="button"
          id="claudero-pref-tab-prev"
          class="claudero-pref-tab-arrow"
          data-l10n-id="pref-tabs-previous"
          >‹</html:button
        >
        <html:div class="claudero-pref-tabs" id="claudero-pref-tabs-nav">
          <html:button
            type="button"
            id="claudero-pref-tab-general"
            class="claudero-pref-tab"
            data-active="true"
            data-panel="general"
            data-l10n-id="pref-tab-general"
          ></html:button>
          <html:button
            type="button"
            id="claudero-pref-tab-claude"
            class="claudero-pref-tab"
            data-panel="claude"
            data-l10n-id="pref-tab-claude"
          ></html:button>
          <html:button
            type="button"
            id="claudero-pref-tab-codex"
            class="claudero-pref-tab"
            data-panel="codex"
            data-l10n-id="pref-tab-codex"
          ></html:button>
          <html:button
            type="button"
            id="claudero-pref-tab-deepseek"
            class="claudero-pref-tab"
            data-panel="deepseek"
            data-l10n-id="pref-tab-deepseek"
          ></html:button>
          <html:button
            type="button"
            id="claudero-pref-tab-mcp"
            class="claudero-pref-tab"
            data-panel="mcp"
            data-l10n-id="pref-tab-mcp"
          ></html:button>
          <html:button
            type="button"
            id="claudero-pref-tab-skills"
            class="claudero-pref-tab"
            data-panel="skills"
            data-l10n-id="pref-tab-skills"
          ></html:button>
          <html:button
            type="button"
            id="claudero-pref-tab-diagnostics"
            class="claudero-pref-tab"
            data-panel="diagnostics"
            data-l10n-id="pref-tab-diagnostics"
          ></html:button>
          <html:div id="claudero-pref-tab-indicator"></html:div>
        </html:div>
        <html:button
          type="button"
          id="claudero-pref-tab-next"
          class="claudero-pref-tab-arrow"
          data-l10n-id="pref-tabs-next"
          >›</html:button
        >
      </html:div>
      <html:div class="claudero-pref-tab-content">
        <html:input
          type="hidden"
          id="zotero-prefpane-__addonRef__-providerConfigs"
          preference="providerConfigs"
        ></html:input>
        <html:input
          type="hidden"
          id="zotero-prefpane-__addonRef__-mcpServers"
          preference="mcpServers"
        ></html:input>
        <html:input
          type="hidden"
          id="zotero-prefpane-__addonRef__-academicSkills"
          preference="academicSkills"
        ></html:input>
        <vbox id="claudero-pref-panel-general" class="claudero-pref-panel">
          <html:div class="claudero-pref-intro">
            <html:strong data-l10n-id="pref-intro-general-title"></html:strong>
            <html:p data-l10n-id="pref-intro-general-description"></html:p>
          </html:div>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="zotero-prefpane-__addonRef__-nodePath"
              data-l10n-id="pref-node-path"
            ></html:label>
            <html:input
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              type="text"
              id="zotero-prefpane-__addonRef__-nodePath"
              preference="nodePath"
              data-l10n-id="pref-node-path-placeholder"
              placeholder="/opt/homebrew/bin/node"
            ></html:input>
          </hbox>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="zotero-prefpane-__addonRef__-provider"
              data-l10n-id="pref-provider"
            ></html:label>
            <menulist
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              native="true"
              id="zotero-prefpane-__addonRef__-provider"
              preference="provider"
            >
              <menupopup>
                <menuitem value="claude" label="Claude Code" />
                <menuitem value="codex" label="Codex" />
                <menuitem value="deepseek" label="DeepSeek Harness" />
              </menupopup>
            </menulist>
          </hbox>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="zotero-prefpane-__addonRef__-workspacePath"
              data-l10n-id="pref-workspace-path"
            ></html:label>
            <html:input
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              type="text"
              id="zotero-prefpane-__addonRef__-workspacePath"
              preference="workspacePath"
              data-l10n-id="pref-workspace-path-placeholder"
              placeholder="Leave empty to use the Zotero profile"
            ></html:input>
          </hbox>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="zotero-prefpane-__addonRef__-helperPort"
              data-l10n-id="pref-helper-port"
            ></html:label>
            <html:input
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              type="number"
              id="zotero-prefpane-__addonRef__-helperPort"
              preference="helperPort"
              min="1024"
              max="65535"
            ></html:input>
          </hbox>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="zotero-prefpane-__addonRef__-proxy"
              data-l10n-id="pref-proxy"
            ></html:label>
            <html:input
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              type="text"
              id="zotero-prefpane-__addonRef__-proxy"
              preference="proxy"
              data-l10n-id="pref-proxy-placeholder"
              placeholder="http://127.0.0.1:7890 (leave empty to disable)"
            ></html:input>
          </hbox>
          <hbox
            class="claudero-pref-row claudero-pref-row-tall"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="zotero-prefpane-__addonRef__-environmentVariables"
              data-l10n-id="pref-env"
            ></html:label>
            <html:textarea
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              id="zotero-prefpane-__addonRef__-environmentVariables"
              preference="environmentVariables"
              rows="5"
              data-l10n-id="pref-env-placeholder"
              placeholder="PATH=/opt/homebrew/bin:/usr/local/bin:$PATH"
            ></html:textarea>
          </hbox>
          <html:div class="claudero-pref-setup-panel">
            <html:div class="claudero-pref-setup-head">
              <html:strong data-l10n-id="pref-setup-title"></html:strong>
              <html:button
                type="button"
                id="claudero-pref-setup-run"
                data-l10n-id="pref-setup-run"
              ></html:button>
            </html:div>
            <html:div
              id="claudero-pref-setup-status"
              class="claudero-pref-status"
              role="status"
              aria-live="polite"
            ></html:div>
            <html:div
              id="claudero-pref-setup-details"
              class="claudero-pref-setup-details"
            ></html:div>
          </html:div>
        </vbox>
        <vbox
          id="claudero-pref-panel-claude"
          class="claudero-pref-panel"
          hidden="true"
        >
          <html:div class="claudero-pref-intro">
            <html:strong data-l10n-id="pref-intro-claude-title"></html:strong>
            <html:p data-l10n-id="pref-intro-claude-description"></html:p>
          </html:div>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              data-l10n-id="pref-current-host"
            ></html:label>
            <html:code
              id="claudero-pref-host-key"
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
            ></html:code>
          </hbox>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="claudero-pref-claude-path"
              data-l10n-id="pref-claude-path"
            ></html:label>
            <html:input
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              type="text"
              id="claudero-pref-claude-path"
              data-l10n-id="pref-claude-path-placeholder"
              placeholder="/Users/you/.claude/local/claude"
            ></html:input>
          </hbox>
          <hbox
            class="claudero-pref-row claudero-pref-row-tall"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="claudero-pref-claude-env"
              data-l10n-id="pref-provider-env"
            ></html:label>
            <html:textarea
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              id="claudero-pref-claude-env"
              rows="5"
              data-l10n-id="pref-claude-env-placeholder"
              placeholder="ANTHROPIC_API_KEY=..."
            ></html:textarea>
          </hbox>
        </vbox>
        <vbox
          id="claudero-pref-panel-codex"
          class="claudero-pref-panel"
          hidden="true"
        >
          <html:div class="claudero-pref-intro">
            <html:strong data-l10n-id="pref-intro-codex-title"></html:strong>
            <html:p data-l10n-id="pref-intro-codex-description"></html:p>
          </html:div>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              data-l10n-id="pref-current-host"
            ></html:label>
            <html:code
              id="claudero-pref-host-key-codex"
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
            ></html:code>
          </hbox>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="claudero-pref-codex-path"
              data-l10n-id="pref-codex-path"
            ></html:label>
            <html:input
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              type="text"
              id="claudero-pref-codex-path"
              data-l10n-id="pref-codex-path-placeholder"
              placeholder="/opt/homebrew/bin/codex"
            ></html:input>
          </hbox>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="claudero-pref-codex-installation"
              data-l10n-id="pref-codex-installation"
            ></html:label>
            <menulist
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              native="true"
              id="claudero-pref-codex-installation"
            >
              <menupopup>
                <menuitem
                  value="native"
                  data-l10n-id="pref-codex-installation-native"
                />
                <menuitem
                  value="wsl"
                  data-l10n-id="pref-codex-installation-wsl"
                />
              </menupopup>
            </menulist>
          </hbox>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="claudero-pref-codex-wsl-distro"
              data-l10n-id="pref-codex-wsl-distro"
            ></html:label>
            <html:input
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              type="text"
              id="claudero-pref-codex-wsl-distro"
              data-l10n-id="pref-codex-wsl-placeholder"
              placeholder="Ubuntu"
            ></html:input>
          </hbox>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="claudero-pref-codex-safe-mode"
              data-l10n-id="pref-codex-safe-mode"
            ></html:label>
            <menulist
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              native="true"
              id="claudero-pref-codex-safe-mode"
            >
              <menupopup>
                <menuitem
                  value="workspace-write"
                  data-l10n-id="pref-codex-safe-workspace"
                />
                <menuitem
                  value="read-only"
                  data-l10n-id="pref-codex-safe-readonly"
                />
              </menupopup>
            </menulist>
          </hbox>
          <hbox
            class="claudero-pref-row claudero-pref-row-tall"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="claudero-pref-codex-env"
              data-l10n-id="pref-provider-env"
            ></html:label>
            <html:textarea
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              id="claudero-pref-codex-env"
              rows="5"
              data-l10n-id="pref-codex-env-placeholder"
              placeholder="OPENAI_API_KEY=..."
            ></html:textarea>
          </hbox>
        </vbox>
        <vbox
          id="claudero-pref-panel-deepseek"
          class="claudero-pref-panel"
          hidden="true"
        >
          <html:div class="claudero-pref-intro">
            <html:strong data-l10n-id="pref-intro-deepseek-title"></html:strong>
            <html:p data-l10n-id="pref-intro-deepseek-description"></html:p>
          </html:div>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              data-l10n-id="pref-current-host"
            ></html:label>
            <html:code
              id="claudero-pref-host-key-deepseek"
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
            ></html:code>
          </hbox>
          <hbox
            class="claudero-pref-row"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="claudero-pref-deepseek-path"
              data-l10n-id="pref-deepseek-path"
            ></html:label>
            <html:input
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              type="text"
              id="claudero-pref-deepseek-path"
              data-l10n-id="pref-deepseek-path-placeholder"
              placeholder="/opt/homebrew/bin/dsh"
            ></html:input>
          </hbox>
          <hbox
            class="claudero-pref-row claudero-pref-row-tall"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="claudero-pref-deepseek-env"
              data-l10n-id="pref-provider-env"
            ></html:label>
            <html:textarea
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              id="claudero-pref-deepseek-env"
              rows="5"
              data-l10n-id="pref-deepseek-env-placeholder"
              placeholder="DEEPSEEK_API_KEY=...&#10;DEEPSEEK_BASE_URL=https://api.deepseek.com"
            ></html:textarea>
          </hbox>
        </vbox>
        <vbox
          id="claudero-pref-panel-mcp"
          class="claudero-pref-panel"
          hidden="true"
        >
          <html:div class="claudero-pref-intro">
            <html:strong data-l10n-id="pref-intro-mcp-title"></html:strong>
            <html:p data-l10n-id="pref-intro-mcp-description"></html:p>
          </html:div>
          <hbox
            class="claudero-pref-row claudero-pref-row-tall"
            style="display: flex; align-items: center; width: 100%"
          >
            <html:label
              class="claudero-pref-row-label"
              for="claudero-pref-mcp-servers"
              data-l10n-id="pref-mcp-servers"
            ></html:label>
            <html:textarea
              class="claudero-pref-control"
              style="flex: 1"
              flex="1"
              id="claudero-pref-mcp-servers"
              rows="12"
              data-l10n-id="pref-mcp-servers-placeholder"
              placeholder='{"mcpServers":{"filesystem":{"command":"npx","args":["-y","@modelcontextprotocol/server-filesystem","/tmp"]}}}'
            ></html:textarea>
          </hbox>
          <hbox class="claudero-pref-mcp-actions">
            <button
              native="true"
              id="claudero-pref-mcp-add-stdio"
              data-l10n-id="pref-mcp-add-stdio"
            ></button>
            <button
              native="true"
              id="claudero-pref-mcp-add-http"
              data-l10n-id="pref-mcp-add-http"
            ></button>
          </hbox>
          <html:div
            id="claudero-pref-mcp-list"
            class="claudero-pref-mcp-list"
          ></html:div>
          <html:div
            id="claudero-pref-mcp-status"
            class="claudero-pref-status"
            role="status"
            aria-live="polite"
          ></html:div>
        </vbox>
        <vbox
          id="claudero-pref-panel-skills"
          class="claudero-pref-panel"
          hidden="true"
        >
          <html:div class="claudero-pref-intro">
            <html:strong data-l10n-id="pref-intro-skills-title"></html:strong>
            <html:p data-l10n-id="pref-intro-skills-description"></html:p>
          </html:div>
          <hbox class="claudero-pref-skills-actions">
            <html:input
              type="text"
              id="claudero-pref-skills-test-input"
              data-l10n-id="pref-skills-test-placeholder"
            ></html:input>
            <html:button
              type="button"
              id="claudero-pref-skills-test"
              data-l10n-id="pref-skills-test"
            ></html:button>
          </hbox>
          <html:div
            id="claudero-pref-skills-test-result"
            class="claudero-pref-status"
            role="status"
            aria-live="polite"
          ></html:div>
          <html:div
            id="claudero-pref-skills-list"
            class="claudero-pref-skills-list"
          ></html:div>
          <html:div class="claudero-pref-skill-import-panel">
            <html:div class="claudero-pref-skill-import-head">
              <html:label
                class="claudero-pref-skill-import-title"
                for="claudero-pref-skills-import"
                data-l10n-id="pref-skills-import"
              ></html:label>
              <html:div class="claudero-pref-skill-import-formats">
                <html:span>Claudero JSON</html:span>
                <html:span>SKILL.md</html:span>
                <html:span>MCP JSON</html:span>
                <html:span>Markdown</html:span>
              </html:div>
            </html:div>
            <html:textarea
              id="claudero-pref-skills-import"
              class="claudero-pref-skill-import-textarea"
              rows="7"
              data-l10n-id="pref-skills-import-placeholder"
            ></html:textarea>
            <html:div class="claudero-pref-skill-import-actions">
              <html:button
                type="button"
                id="claudero-pref-skills-import-button"
                data-l10n-id="pref-skills-import-button"
              ></html:button>
            </html:div>
          </html:div>
          <html:div
            id="claudero-pref-skills-status"
            class="claudero-pref-status"
            role="status"
            aria-live="polite"
          ></html:div>
        </vbox>
        <vbox
          id="claudero-pref-panel-diagnostics"
          class="claudero-pref-panel"
          hidden="true"
        >
          <html:div class="claudero-pref-intro">
            <html:strong
              data-l10n-id="pref-intro-diagnostics-title"
            ></html:strong>
            <html:p data-l10n-id="pref-intro-diagnostics-description"></html:p>
          </html:div>
          <hbox class="claudero-pref-diagnostics-actions">
            <html:button
              type="button"
              id="claudero-pref-diagnostics-refresh"
              data-l10n-id="pref-diagnostics-refresh"
            ></html:button>
            <html:button
              type="button"
              id="claudero-pref-diagnostics-export"
              data-l10n-id="pref-diagnostics-export"
            ></html:button>
            <html:button
              type="button"
              id="claudero-pref-diagnostics-restart"
              data-l10n-id="pref-diagnostics-restart"
            ></html:button>
          </hbox>
          <html:div
            id="claudero-pref-diagnostics-summary"
            class="claudero-pref-diagnostics"
          ></html:div>
          <html:pre
            id="claudero-pref-diagnostics-trace"
            class="claudero-pref-diagnostics-trace"
          ></html:pre>
          <html:div
            id="claudero-pref-diagnostics-status"
            class="claudero-pref-status"
            role="status"
            aria-live="polite"
          ></html:div>
        </vbox>
      </html:div>
    </html:div>
  </vbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
